[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ci-why"
version = "0.1.0"
description = "Diagnose CI failures instantly — extract signal lines and explain them in plain English"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "gitwingo", email = "gitwingo@users.noreply.github.com" }
]
keywords = ["ci", "devops", "debugging", "github-actions", "build", "logs", "cli", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]
dependencies = [
  "httpx>=0.27.0,<1.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.scripts]
ci-why = "ci_why:app"

[project.urls]
Homepage     = "https://github.com/gitwingo/ci-why"
Repository   = "https://github.com/gitwingo/ci-why"
"Bug Tracker" = "https://github.com/gitwingo/ci-why/issues"

[tool.hatch.build.targets.wheel]
packages = ["ci_why"]
